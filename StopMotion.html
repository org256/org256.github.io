<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stop Motion Studio</title>
<style>
:root{--bg:#f3f3f6;--pn:#fff;--tx:#1c1c22;--mu:#6b6b78;--ac:#e8590c;--bd:#d6d6de;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#121217;--pn:#1d1d25;--tx:#f0f0f5;--mu:#9a9aab;--bd:#33333f;color-scheme:dark}}
:root[data-theme=dark]{--bg:#121217;--pn:#1d1d25;--tx:#f0f0f5;--mu:#9a9aab;--bd:#33333f;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:15px -apple-system,Helvetica,Arial,sans-serif;display:flex;flex-direction:column;overflow:hidden;touch-action:manipulation}
button,select,input,textarea{font:inherit;color:var(--tx)}
button,.btn{background:var(--pn);border:1px solid var(--bd);border-radius:10px;padding:10px 13px;min-height:44px;cursor:pointer;white-space:nowrap}
button.p{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:700}
button.on{outline:2px solid var(--ac)}
#bar{display:flex;gap:8px;padding:8px;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--bd);background:var(--pn)}
#bar label{display:flex;align-items:center;gap:6px;color:var(--mu)}
select,input[type=text],input[type=number],textarea{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px;min-height:40px}
main{flex:1;min-height:0;display:grid;grid-template-columns:1fr 280px;gap:8px;padding:8px}
#stage{min-height:0;display:flex;flex-direction:column;gap:6px}
#cvw{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#000;border-radius:12px;overflow:hidden;position:relative}
canvas{max-width:100%;max-height:100%;aspect-ratio:16/9;background:#000}
#vid{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
#msg{color:var(--mu);font-size:13px;min-height:18px}
#side{overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.pn{background:var(--pn);border:1px solid var(--bd);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
.pn h3{margin:0;font-size:14px}.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sn{padding:8px 10px;min-height:38px}
#tlw{background:var(--pn);border-top:1px solid var(--bd);padding:6px 8px}
#tl{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch}
.col{flex:0 0 76px;display:flex;flex-direction:column;gap:3px;align-items:stretch;border-radius:8px;padding:2px}
.col.sel{outline:2px solid var(--ac)}.col.now{background:rgba(232,89,12,.25)}
.th{height:44px;border-radius:6px;overflow:hidden;background:#000;position:relative;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;text-align:center}
.th img{width:100%;height:100%;object-fit:cover}.th b{position:absolute;right:2px;top:1px;background:var(--ac);color:#fff;border-radius:4px;padding:0 4px;font-size:10px}
.cd{width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:2px}
.nm{font-size:11px;color:var(--mu);text-align:center}
.ln{min-height:34px;border:1px dashed var(--bd);border-radius:6px;display:flex;flex-direction:column;gap:2px;padding:2px}
.chip{background:#1971c2;color:#fff;border-radius:5px;font-size:10px;padding:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hd{font-size:11px;color:var(--mu);padding:0 2px 4px}
#res{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
#res[hidden]{display:none}
#res .pn{max-width:640px;width:100%}#rv{width:100%;border-radius:8px;background:#000}
@media(max-width:820px){main{grid-template-columns:1fr;overflow-y:auto}#side{overflow:visible}#cvw{min-height:200px}}
</style></head><body>
<div id="bar">
 <button id="bCam">📷 Camera</button>
 <label class="btn" style="display:inline-flex;align-items:center">🖼 Add photos<input id="imp" type="file" accept="image/*" multiple hidden></label>
 <button id="bCap" class="p">● Capture</button>
 <button id="bDel">🗑 Delete</button><button id="bDup">⧉ Hold</button><button id="bL">◀</button><button id="bR">▶</button>
 <label>FPS <select id="fps"><option>6</option><option selected>12</option><option>15</option><option>24</option></select></label>
 <button id="bOn" class="on">🧅 Onion</button>
 <label><input id="oa" type="range" min="10" max="80" value="40" style="width:80px"><select id="oc"><option>1</option><option selected>2</option><option>3</option></select></label>
 <button id="bPlay">▶ Play</button><button id="bExp" class="p">⬇ Export video</button>
</div>
<main>
 <div id="stage"><div id="cvw"><canvas id="cv" width="960" height="540"></canvas><video id="vid" playsinline muted></video></div><div id="msg"></div></div>
 <div id="side">
  <div class="pn"><h3>🔊 Sound effects</h3>
   <div class="row" id="lib"></div>
   <div class="row"><label class="btn" style="display:inline-flex;align-items:center">+ Import<input id="aim" type="file" accept="audio/*" hidden></label><button id="bRec">🎙 Record</button></div>
   <div class="nm" style="text-align:left">Tap a sound to arm it, then tap a dashed slot under any frame to place it. Tap a placed sound to remove it.</div></div>
  <div class="pn"><h3>🅣 Titles &amp; captions</h3>
   <textarea id="tx" rows="2" placeholder="Text…"></textarea>
   <div class="row"><input id="bg" type="color" value="#1b1b3a"><input id="fg" type="color" value="#ffffff"><input id="du" type="number" min="1" max="15" value="3" style="width:64px"><span class="nm">sec</span>
   <select id="pos"><option value="start">at start</option><option value="end">at end</option><option value="after">after selected</option></select></div>
   <button id="bCard" class="p">Add title card</button>
   <div class="row"><button id="bSetCap">Caption selected frame</button><button id="bClrCap">Clear</button></div></div>
 </div>
</main>
<div id="tlw"><div class="hd" id="info"></div><div id="tl"></div></div>
<div id="res" hidden><div class="pn"><h3>Your movie is ready</h3><video id="rv" controls playsinline></video>
 <div class="row"><button id="bShare" class="p">Share / Save to Drive</button><button id="bSave">Save file</button><button id="bClose">Close</button></div>
 <div class="nm" style="text-align:left">Share opens the iPad share sheet: pick Drive (Google Drive app) or Save to Files.</div></div></div>
<script>
const $=s=>document.querySelector(s),W=960,H=540,cv=$('#cv'),cx=cv.getContext('2d'),vid=$('#vid');
let items=[],placed=[],sel=-1,live=false,stream=null,fps=12,onion=true,armed=null,playing=false,halt=false,AC=null,outFile=null,lastNow=-1;
const ac=()=>AC||(AC=new(window.AudioContext||window.webkitAudioContext)());
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const msg=t=>$('#msg').textContent=t;
const dur=i=>i.t==='c'?i.dur:1/fps;
const starts=()=>{let t=0;const a=items.map(i=>{const s=t;t+=dur(i);return s});a.push(t);return a};

/* ---- sounds ---- */
function synth(n,f){const a=ac(),sr=a.sampleRate,L=sr*n|0,b=a.createBuffer(1,L,sr),d=b.getChannelData(0);for(let i=0;i<L;i++)d[i]=f(i/sr,i/L);return b}
const PI=Math.PI,S=Math.sin,E=Math.exp,R=()=>Math.random()*2-1;
const lib=[
 {name:'Pop',mk:()=>synth(.15,(t,p)=>S(2*PI*(700-500*p)*t)*(1-p)**2*.8)},
 {name:'Boing',mk:()=>synth(.7,(t)=>S(2*PI*(180+50*S(24*t))*t)*E(-4*t)*.8)},
 {name:'Whoosh',mk:()=>synth(.6,(t,p)=>R()*S(PI*p)**2*.4)},
 {name:'Ding',mk:()=>synth(1,(t)=>(S(2*PI*880*t)+.5*S(2*PI*1320*t))*E(-5*t)*.4)},
 {name:'Thud',mk:()=>synth(.4,(t)=>(S(2*PI*70*t)+.2*R())*E(-12*t)*.9)}];
const buf=s=>s.buf||(s.buf=s.mk());
function beep(s){const a=ac();a.resume();const n=a.createBufferSource();n.buffer=buf(s);n.connect(a.destination);n.start()}
function drawLib(){$('#lib').innerHTML=lib.map((s,i)=>`<button class="sn${armed===s?' on':''}" data-i="${i}">${esc(s.name)}</button>`).join('')}
$('#lib').onclick=e=>{const b=e.target.closest('button');if(!b)return;const s=lib[+b.dataset.i];armed=armed===s?null:s;if(armed){beep(s);msg('Armed “'+s.name+'” – tap a slot under a frame to place it.')}drawLib()};
async function addAudio(name,ab){try{const a=ac(),b=await a.decodeAudioData(ab);lib.push({name,buf:b});armed=lib[lib.length-1];drawLib();msg('Added “'+name+'”.')}catch(e){msg('Could not read that audio.')}}
$('#aim').onchange=async e=>{const f=e.target.files[0];if(f)addAudio(f.name.replace(/\.\w+$/,'').slice(0,12),await f.arrayBuffer());e.target.value=''};
let mr=null;
$('#bRec').onclick=async()=>{try{if(mr){mr.stop();return}const ms=await navigator.mediaDevices.getUserMedia({audio:true}),ch=[];mr=new MediaRecorder(ms);mr.ondataavailable=e=>ch.push(e.data);mr.onstop=async()=>{ms.getTracks().forEach(t=>t.stop());const b=new Blob(ch);mr=null;$('#bRec').textContent='🎙 Record';$('#bRec').classList.remove('on');addAudio('Rec '+lib.length,await b.arrayBuffer())};mr.start();$('#bRec').textContent='⏹ Stop';$('#bRec').classList.add('on')}catch(e){mr=null;msg('Microphone unavailable here – use Import instead.')}};

/* ---- camera & frames ---- */
async function cam(){try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1920},height:{ideal:1080}},audio:false});vid.srcObject=stream;await vid.play();live=true;sel=-1;render();msg('Camera on. Tap Capture for each frame.')}catch(e){live=false;msg('Camera not available inside this page – use “Add photos” (it opens the iPad camera) instead.')}}
$('#bCam').onclick=cam;
function cover(c,s,sw,sh){const r=Math.max(W/sw,H/sh),w=sw*r,h=sh*r;c.drawImage(s,(W-w)/2,(H-h)/2,w,h)}
function push(c){return new Promise(res=>c.toBlob(async b=>{const url=URL.createObjectURL(b),img=new Image();img.src=url;await img.decode();items.push({t:'f',img,url});res()},'image/jpeg',.85))}
$('#bCap').onclick=async()=>{if(!live||!vid.videoWidth)return msg('Turn the camera on first (or use Add photos).');const c=document.createElement('canvas');c.width=W;c.height=H;cover(c.getContext('2d'),vid,vid.videoWidth,vid.videoHeight);await push(c);sel=-1;render();$('#tl').scrollLeft=1e6};
$('#imp').onchange=async e=>{for(const f of e.target.files){const im=new Image();im.src=URL.createObjectURL(f);try{await im.decode()}catch(_){continue}const c=document.createElement('canvas');c.width=W;c.height=H;cover(c.getContext('2d'),im,im.naturalWidth,im.naturalHeight);await push(c)}e.target.value='';render();$('#tl').scrollLeft=1e6;msg('Photos added.')};
const rm=it=>{placed=placed.filter(p=>p.item!==it)};
$('#bDel').onclick=()=>{if(sel<0)return;rm(items[sel]);items.splice(sel,1);sel=Math.min(sel,items.length-1);render()};
$('#bDup').onclick=()=>{if(sel<0)return;const o=items[sel];items.splice(sel+1,0,{...o});sel++;render()};
const mv=d=>{const j=sel+d;if(sel<0||j<0||j>=items.length)return;[items[sel],items[j]]=[items[j],items[sel]];sel=j;render()};
$('#bL').onclick=()=>mv(-1);$('#bR').onclick=()=>mv(1);
$('#fps').onchange=e=>{fps=+e.target.value;render()};
$('#bOn').onclick=e=>{onion=!onion;e.target.classList.toggle('on',onion)};

/* ---- titles & captions ---- */
function wrap(s,mw){const out=[];String(s).split('\n').forEach(p=>{let l='';p.split(' ').forEach(w=>{const t=l?l+' '+w:w;if(cx.measureText(t).width>mw&&l){out.push(l);l=w}else l=t});out.push(l)});return out}
function txt(s,col,sz,bottom){cx.font=`700 ${sz}px -apple-system,Helvetica,Arial,sans-serif`;cx.textAlign='center';cx.textBaseline='middle';const ls=wrap(s,W-120),lh=sz*1.25,h=ls.length*lh;let y0;if(bottom){y0=H-28-h;cx.fillStyle='rgba(0,0,0,.6)';cx.fillRect(0,y0-18,W,h+46)}else y0=(H-h)/2;cx.fillStyle=col;ls.forEach((l,i)=>cx.fillText(l,W/2,y0+lh*i+lh/2))}
function drawItem(it){cx.globalAlpha=1;if(it.t==='f')cx.drawImage(it.img,0,0,W,H);else{cx.fillStyle=it.bg;cx.fillRect(0,0,W,H);txt(it.text,it.fg,64)}if(it.cap)txt(it.cap,'#fff',34,true)}
$('#bCard').onclick=()=>{const t=$('#tx').value.trim();if(!t)return msg('Type some text first.');const it={t:'c',text:t,bg:$('#bg').value,fg:$('#fg').value,dur:Math.max(1,+$('#du').value||3)},p=$('#pos').value;if(p==='start')items.unshift(it);else if(p==='after'&&sel>=0)items.splice(sel+1,0,it);else items.push(it);sel=items.indexOf(it);render()};
$('#bSetCap').onclick=()=>{const t=$('#tx').value.trim();if(sel<0||!t)return msg('Select a frame and type a caption.');items[sel].cap=t;render()};
$('#bClrCap').onclick=()=>{if(sel>=0){delete items[sel].cap;render()}};

/* ---- timeline ---- */
function render(){const st=starts();$('#tl').innerHTML=items.map((it,i)=>`<div class="col${i===sel?' sel':''}" data-i="${i}"><div class="th">${it.t==='f'?`<img src="${it.url}">`:`<div class="cd" style="background:${it.bg};color:${it.fg}">${esc(it.text)}</div>`}${it.cap?'<b>T</b>':''}</div><div class="nm">${it.t==='c'?'title '+it.dur+'s':i+1}</div><div class="ln">${placed.map((p,k)=>p.item===it?`<span class="chip" data-k="${k}">${esc(p.s.name)}</span>`:'').join('')}</div></div>`).join('')+`<div class="col" data-live="1"><div class="th" style="background:var(--bg);color:var(--tx)">${live?'● Live':'No cam'}</div></div>`;
 $('#info').textContent=items.length+' items · '+st[st.length-1].toFixed(1)+' s @ '+fps+' fps'}
$('#tl').onclick=e=>{const c=e.target.closest('.col');if(!c)return;if(c.dataset.live){sel=-1;return render()}const i=+c.dataset.i,ch=e.target.closest('.chip');if(ch){placed.splice(+ch.dataset.k,1);return render()}if(e.target.closest('.ln')&&armed){placed.push({s:armed,item:items[i]});return render()}sel=i;render()};
function hi(k){if(k===lastNow)return;lastNow=k;document.querySelectorAll('.col').forEach(c=>c.classList.toggle('now',+c.dataset.i===k));const c=document.querySelector(`.col[data-i="${k}"]`);if(c)c.scrollIntoView({inline:'center',block:'nearest'})}

/* ---- preview loop ---- */
function loop(){if(!playing){cx.fillStyle='#000';cx.fillRect(0,0,W,H);
 if(sel>=0&&items[sel])drawItem(items[sel]);
 else{if(live&&vid.videoWidth)cover(cx,vid,vid.videoWidth,vid.videoHeight);
  if(onion){const n=+$('#oc').value,fr=items.filter(i=>i.t==='f').slice(-n),a=$('#oa').value/100;fr.forEach((f,k)=>{cx.globalAlpha=a*(k+1)/fr.length;cx.drawImage(f.img,0,0,W,H)});cx.globalAlpha=1}}}
 requestAnimationFrame(loop)}
loop();

/* ---- play & export ---- */
async function play(rec){
 if(playing){halt=true;return}
 if(!items.length)return msg('Add some frames first.');
 const a=ac();await a.resume();const dest=a.createMediaStreamDestination(),out=rec?dest:a.destination,st=starts(),total=st[st.length-1],t0=a.currentTime+.3,srcs=[];
 placed.forEach(p=>{const k=items.indexOf(p.item);if(k<0)return;const n=a.createBufferSource();n.buffer=buf(p.s);n.connect(out);n.start(t0+st[k]);srcs.push(n)});
 let r=null,ch=[];
 if(rec){const ts=cv.captureStream(30);dest.stream.getAudioTracks().forEach(t=>ts.addTrack(t));const mt=['video/mp4','video/webm;codecs=vp9,opus','video/webm'].find(m=>window.MediaRecorder&&MediaRecorder.isTypeSupported(m));try{r=new MediaRecorder(ts,mt?{mimeType:mt,videoBitsPerSecond:6e6}:{})}catch(e){return msg('Video recording is not supported on this browser.')}r.ondataavailable=e=>e.data.size&&ch.push(e.data);r.start(250)}
 playing=true;halt=false;$('#bPlay').textContent='⏹ Stop';msg(rec?'Exporting in real time – keep this tab open…':'Playing…');
 await new Promise(res=>{(function tick(){const e=a.currentTime-t0;if(halt||e>=total+.3)return res();let k=0;if(e>0){k=st.findIndex((s,j)=>j<items.length&&e>=s&&e<st[j+1]);if(k<0)k=items.length-1}cx.fillStyle='#000';cx.fillRect(0,0,W,H);drawItem(items[k]);hi(k);requestAnimationFrame(tick)})()});
 srcs.forEach(n=>{try{n.stop()}catch(_){}});playing=false;lastNow=-1;hi(-9);$('#bPlay').textContent='▶ Play';
 if(r){await new Promise(x=>{r.onstop=x;r.stop()});if(halt){msg('Export cancelled.');return}const type=(r.mimeType||'video/mp4').split(';')[0],b=new Blob(ch,{type});outFile=new File([b],'stopmotion.'+(type.includes('mp4')?'mp4':'webm'),{type});$('#rv').src=URL.createObjectURL(b);$('#res').hidden=false;msg('Done.')}else msg('')}
$('#bPlay').onclick=()=>play(false);
$('#bExp').onclick=()=>play(true);
$('#bClose').onclick=()=>{$('#res').hidden=true;$('#rv').pause()};
$('#bShare').onclick=async()=>{try{if(navigator.canShare&&navigator.canShare({files:[outFile]}))await navigator.share({files:[outFile],title:'Stop motion movie'});else await save()}catch(e){if(e.name!=='AbortError')save()}};
async function save(){try{const d=window.claude&&await claude.use('downloads');if(!d)return msg('Saving is not available in this view – open the artifact in claude.ai.');await d.save({filename:outFile.name,data:outFile})}catch(e){if(e&&e.code!=='declined')msg('Save failed: '+(e.message||e.code||e))}}
$('#bSave').onclick=save;
drawLib();render();
</script></body></html>
