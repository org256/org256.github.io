<style>
:root{--bg:#9bd4f5;--panel:rgba(0,0,0,.6);--fg:#fff;--accent:#f0902a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;font-family:system-ui,sans-serif;color:var(--fg)}
canvas{display:block}
#hud,#msg,#help{position:fixed;background:var(--panel);border-radius:10px;padding:8px 12px;font-size:14px;line-height:1.4;white-space:pre-line}
#hud{left:12px;top:calc(env(safe-area-inset-top,0px) + 12px);max-width:320px}
#help{left:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);font-size:12px;opacity:.8}
#msg{left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 70px);transform:translateX(-50%);max-width:70%;display:none}
#quests{position:fixed;right:12px;top:calc(env(safe-area-inset-top,0px) + 12px);max-width:340px;background:var(--panel);border-radius:10px;padding:8px 12px;font-size:13px;line-height:1.45;white-space:pre-line}
#quests:empty{display:none}
body.vr #hud,body.vr #quests,body.vr #msg,body.vr #help,body.vr #bar{display:none!important}
#touch{display:none;position:fixed;inset:0;pointer-events:none;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
body.touch #touch{display:block}
#joyzone{position:absolute;left:0;bottom:0;width:50%;height:65%;pointer-events:auto;touch-action:none}
#joy{position:absolute;left:28px;bottom:calc(env(safe-area-inset-bottom,0px) + 40px);width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.18);border:3px solid rgba(255,255,255,.5);pointer-events:none}
#knob{position:absolute;left:35px;top:35px;width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,.55)}
#touch .tb{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;pointer-events:auto;touch-action:none;background:rgba(240,144,42,.8);border:4px solid rgba(255,255,255,.8);color:#fff}
#touch .tb.on{transform:scale(.92);filter:brightness(1.25)}
#bAtk{right:28px;bottom:calc(env(safe-area-inset-bottom,0px) + 50px);width:104px;height:104px;font-size:44px}
#bRoll{right:150px;bottom:calc(env(safe-area-inset-bottom,0px) + 40px);width:62px;height:62px;font-size:26px;background:rgba(60,140,220,.8)}
#bUse{right:48px;bottom:calc(env(safe-area-inset-bottom,0px) + 170px);width:62px;height:62px;font-size:26px;background:rgba(80,180,90,.8)}
body.touch #help{display:none}
body.touch #hud,body.touch #msg,body.touch #quests{pointer-events:none}
body.touch #msg{bottom:calc(env(safe-area-inset-bottom,0px) + 110px)}
body.vr #touch{display:none!important}
#bar{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);display:flex;gap:8px;align-items:center}
#bar button{height:44px;min-width:44px;padding:0 12px;border:0;border-radius:12px;background:var(--panel);color:#fff;font-size:20px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
#bar #vr{background:var(--accent);font-size:15px;font-weight:800;letter-spacing:.5px}
body.touch #bar{right:auto;left:50%;transform:translateX(-50%)}
#title{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;background:linear-gradient(#10202e,#24506e);padding:20px;overflow:auto}
#title h1{margin:0;font-size:clamp(26px,5vw,44px)}
#title p{margin:0 0 8px;opacity:.8}
#tbtns{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
#tbtns button{width:min(300px,80vw);padding:18px;border:0;border-radius:16px;background:var(--accent);color:#fff;font-size:17px;cursor:pointer}
#tbtns button span{font-size:13px;opacity:.9}
#tbtns button:nth-child(2){background:#8e5bd9}
#bJump{right:178px;bottom:calc(env(safe-area-inset-bottom,0px) + 110px);width:62px;height:62px;font-size:26px;background:rgba(150,90,220,.85)}
body:not(.jump) #bJump{display:none}
body.vr #title{display:none!important}

function makeModel(n){
  const d=CONFIG.models[n];if(typeof d=='function')return d();
  const g=new THREE.Group();
  (d||[]).forEach(p=>{const z=p.size;
    const geo=p.s=='torus'?new THREE.TorusGeometry(z[0],z[1],6,16):p.s=='sphere'?new THREE.SphereGeometry(z[0],14,10):p.s=='cone'?new THREE.ConeGeometry(z[0],z[1],8):
      p.s=='cyl'?new THREE.CylinderGeometry(z[0],z[0],z[1],10):new THREE.BoxGeometry(z[0],z[1],z[2]);
    const m=new THREE.Mesh(geo,new THREE.MeshLambertMaterial({color:p.color}));
    m.position.set(...(p.pos||[0,0,0]));if(p.rot)m.rotation.set(...p.rot);if(p.sc)m.scale.set(...p.sc);g.add(m)});
  return g}

// ---- Map
let rows=[],W=1,H=1,MAP,PART=null;
const tileAt=(c,r)=>{if(c<0||r<0||c>=W||r>=H)return{solid:true};return MAP.legend[rows[r][c]||'~']||MAP.legend['.']||MAP.legend['~']};
const solid=(x,z,k)=>{const t=tileAt(Math.floor(x),Math.floor(z));return t.solid||(k==1&&t.water)||(k==2&&!t.water)||(t.gap&&(k>0||P.h<.35))};  // k: 0 player, 1 land enemy, 2 swimmer
const canStand=(x,z,r=.3,k=0)=>!(solid(x-r,z-r,k)||solid(x+r,z-r,k)||solid(x-r,z+r,k)||solid(x+r,z+r,k));
const move=(e,dx,dz)=>{const k=e.k||0;if(canStand(e.x+dx,e.z,.3,k))e.x+=dx;if(canStand(e.x,e.z+dz,.3,k))e.z+=dz};
function mergeStatic(grp){grp.updateMatrixWorld(true);const bk={};
  grp.traverse(o=>{if(!o.isMesh)return;const g=o.geometry.clone();g.applyMatrix4(o.matrixWorld);const k=o.material.color.getHex();(bk[k]=bk[k]||[]).push(g.index?g.toNonIndexed():g)});
  const out=new THREE.Group();
  for(const k in bk){const gs=bk[k];let n=0;gs.forEach(g=>n+=g.attributes.position.count);const pos=new Float32Array(n*3),nor=new Float32Array(n*3);let o=0;
    gs.forEach(g=>{pos.set(g.attributes.position.array,o);nor.set(g.attributes.normal.array,o);o+=g.attributes.position.count*3});
    const mg=new THREE.BufferGeometry();mg.setAttribute('position',new THREE.BufferAttribute(pos,3));mg.setAttribute('normal',new THREE.BufferAttribute(nor,3));
    out.add(new THREE.Mesh(mg,new THREE.MeshLambertMaterial({color:+k})))}
  return out}
function buildGround(){const dec=new THREE.Group(),ground=new THREE.InstancedMesh(new THREE.BoxGeometry(1,.3,1),new THREE.MeshLambertMaterial({color:0xffffff}),W*H);
 const o=new THREE.Object3D(),c=new THREE.Color();let i=0;
 for(let r=0;r<H;r++)for(let q=0;q<W;q++){const t=tileAt(q,r);
  o.position.set(q+.5,t.gap?-1.6:(t.solid&&!t.model)||t.water?-.35:-.15,r+.5);o.updateMatrix();ground.setMatrixAt(i,o.matrix);
  c.set(t.color).offsetHSL(0,0,(Math.random()-.5)*.04);ground.setColorAt(i++,c);
  if(t.model){const m=makeModel(t.model);m.position.set(q+.5,0,r+.5);if(!t.fixed){m.rotation.y=Math.random()*6.28;m.scale.setScalar(.85+Math.random()*.3)}dec.add(m)}}
 ground.instanceMatrix.needsUpdate=ground.instanceColor.needsUpdate=true;world.add(ground);world.add(mergeStatic(dec))}

// Random placement: npcs with rand:true and items with scatter:n get random walkable tiles (chosen once per run).
function expand(){if(MAP._x)return MAP._x;
  const ok=(c,r)=>{const t=tileAt(c,r);return !t.solid&&!t.water&&!t.gap&&!t.noscatter},spots=[];
  for(let r=0;r<H;r++)for(let c=0;c<W;c++)if(ok(c,r)&&Math.hypot(c-MAP.spawn.x,r-MAP.spawn.y)>3)spots.push([c,r]);
  const occ=new Set([...MAP.npcs.filter(n=>!n.rand).map(n=>n.x+','+n.y),...(MAP.portals||[]).map(p=>p.x+','+p.y)]);
  const take=()=>{let s,g=0;do{s=spots[Math.random()*spots.length|0]}while(occ.has(s[0]+','+s[1])&&++g<500);occ.add(s[0]+','+s[1]);return s};
  const npcs=MAP.npcs.map(n=>{if(!n.rand)return n;const s=take();return Object.assign({},n,{x:s[0],y:s[1]})});
  const items=[];(MAP.items||[]).forEach(i=>{if(i.scatter)for(let k=0;k<i.scatter;k++){const s=take();items.push(Object.assign({},i,{x:s[0],y:s[1],scatter:0}))}else items.push(i)});
  return MAP._x={npcs,items}}
const mkNpcs=()=>expand().npcs.map(n=>{const m=makeModel(n.model);m.position.set(n.x+.5,0,n.y+.5);world.add(m);
  const mk=new THREE.Mesh(new THREE.OctahedronGeometry(.17).scale(1,1.6,1),new THREE.MeshBasicMaterial({color:0xffd23f}));mk.position.y=2.2;m.add(mk);return Object.assign({},n,{m,mk,x:n.x+.5,z:n.y+.5})});
const mkItems=()=>expand().items.map((i,k)=>{const m=makeModel(i.model);m.position.set(i.x+.5,0,i.y+.5);m.visible=false;world.add(m);if(i.beacon){const b=new THREE.Mesh(new THREE.CylinderGeometry(.2,.2,16,10),new THREE.MeshBasicMaterial({color:0xffe066,transparent:true,opacity:.4}));b.position.y=8;m.add(b)}return Object.assign({},i,{m,k,got:!!S.got[MAP.name+':'+k],x:i.x+.5,z:i.y+.5})});

function spawnEnemy(s){const d=CONFIG.enemies[s.type],m=makeModel(d.model);m.scale.setScalar(d.scale||1);const bar=new THREE.Group(),bb=new THREE.Mesh(new THREE.PlaneGeometry(1,.16).translate(.5,0,0).rotateX(-Math.PI/2),new THREE.MeshBasicMaterial({color:0x440000})),bf=new THREE.Mesh(new THREE.PlaneGeometry(1,.16).translate(.5,0,0).rotateX(-Math.PI/2),new THREE.MeshBasicMaterial({color:0x44e044}));bb.position.y=-.01;bar.add(bb,bf);bar.position.set(-.5,(d.bar||1.7)+.3,0);bar.visible=false;m.add(bar);world.add(m);
  return{type:s.type,q:s.q,bar,bf,d,k:d.swim?2:1,m,x:s.x+.5,z:s.y+.5,hx:s.x+.5,hz:s.y+.5,tx:s.x+.5,tz:s.y+.5,hp:d.hp,rt:0,flash:0,wt:0,kx:0,kz:0}}

function loadMap(name,x,y){
  MAP=CONFIG.maps[name];MAP.name=name;rows=MAP.map;W=Math.max(...rows.map(r=>r.length));H=rows.length;

  buildGround();npcs=mkNpcs();items=mkItems();rings=mkRings();enemies=mkEnemies();
  portals=(MAP.portals||[]).map(p=>{const g=new THREE.Group(),c=p.color||0x9b5de5;
    g.add(new THREE.Mesh(new THREE.TorusGeometry(.6,.08,8,24),new THREE.MeshBasicMaterial({color:c})));
    g.add(new THREE.Mesh(new THREE.CircleGeometry(.55,24),new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:.4,side:THREE.DoubleSide})));
    g.position.set(p.x+.5,.9,p.y+.5);world.add(g);return Object.assign({},p,{g,x:p.x+.5,z:p.y+.5})});
  P.x=(x==null?MAP.spawn.x:x)+.5;P.z=(y==null?MAP.spawn.y:y)+.5;P.kx=P.kz=0;P.sx=P.x;P.sz=P.z;P.h=0;P.air=false;
  portals.forEach(p=>p.on=Math.hypot(p.x-P.x,p.z-P.z)<.9);
  S.msg='';S.talk=false;applyMode(renderer.xr.isPresenting);camera.position.set(P.x,11,P.z+8);
  if(MAP.title)say('📍 '+MAP.title,3)}

// ---- Quest logic
function progress(kind,key){for(const q of CONFIG.quests){const st=S.q[q.id];if(!st||st.state!='active'||q.type!=kind)continue;
  if((kind=='kill'&&q.target==key)||(kind=='collect'&&q.item==key)){st.prog++;if(st.prog>=q.count){st.state='ready';say(`Quest ready: return to ${npcName(q.giver)}`)}}}}
function interact(n){interact_(n);S.talk=true;S.msgT=10}
function interact_(n){
  const mine=CONFIG.quests.filter(q=>q.giver==n.id),rdy=mine.find(q=>qs(q.id)=='ready');
  if(rdy){S.q[rdy.id].state='done';gain(rdy.reward.xp,rdy.reward.gold);say(`${n.name}: ${rdy.done||'Well done!'}  (+${rdy.reward.xp} XP, +${rdy.reward.gold} gold)`);return}
  const vq=CONFIG.quests.find(q=>qs(q.id)=='active'&&q.type=='visit'&&q.targets.includes(n.id)&&!S.q[q.id].seen[n.id]);
  if(vq){const st=S.q[vq.id];st.seen[n.id]=1;st.prog=Object.keys(st.seen).length;const vt=vq.visitText||'Nice to meet you!';
    if(st.prog>=vq.targets.length){st.state='ready';say(`${n.name}: ${vt}  Return to ${npcName(vq.giver)}.`)}else say(`${n.name}: ${vt} (${st.prog}/${vq.targets.length})`);return}
  const tk=CONFIG.quests.find(q=>qs(q.id)=='active'&&q.type=='talk'&&q.target==n.id);
  if(tk){S.q[tk.id].state='ready';say(`${n.name}: ${tk.talkText||'Hello!'}  Return to ${npcName(tk.giver)}.`);return}
  const nw=mine.find(avail);if(nw){S.q[nw.id]={state:'active',prog:0,seen:{}};say(`${n.name}: ${nw.text}`);return}
  const act=mine.find(q=>qs(q.id)=='active');say(`${n.name}: ${act?(act.reminder||act.text):(Array.isArray(n.idle)?n.idle[Math.random()*n.idle.length|0]:n.idle)}`)}

// ---- Combat
function hurt(d,dx,dz){if(P.inv>0||P.roll>0||S.talk||P.h>.6)return;S.hp-=d;P.inv=1;S.alert=6;const m=Math.hypot(dx,dz)||1;P.kx=-dx/m*7;P.kz=-dz/m*7;
  if(S.hp<=0){S.hp=S.maxhp;S.gold=Math.floor(S.gold/2);P.x=MAP.spawn.x+.5;P.z=MAP.spawn.y+.5;say('You fainted! Half your gold is lost.')}}
function attack(){if(P.atk>0||P.roll>0)return;P.atk=.3;slash.visible=true;const fx=Math.sin(P.ang),fz=Math.cos(P.ang);
  for(const e of enemies){if(e.hp<=0||!e.m.visible)continue;const dx=e.x-P.x,dz=e.z-P.z,d=Math.hypot(dx,dz),sc=e.d.scale||1;
    if(d<1.9*sc&&(dx*fx+dz*fz)/(d||1)>-.1){e.hp-=S.lvl+1;e.flash=.15;flashE(e,true);e.kx=dx/(d||1)*8;e.kz=dz/(d||1)*8;
      if(e.hp<=0){e.rt=15;e.m.visible=false;gain(e.d.xp,e.d.gold);progress('kill',e.type)}}}}

// ---- Touch controls (Brawl Stars style): floating joystick on the left, attack / roll / talk buttons on the right.
// Shown on touch devices; hidden once a keyboard or gamepad is used, and in VR.
const TOUCH={x:0,z:0,a:false,r:false,u:false,j:false};
(()=>{if(!((window.matchMedia&&matchMedia('(pointer:coarse)').matches)||('ontouchstart' in window)))return;
  document.body.classList.add('touch');
  const zone=$('joyzone'),base=$('joy'),knob=$('knob'),R=55;let jid=null,cx=0,cy=0;
  function jm(e){let dx=e.clientX-cx,dy=e.clientY-cy;const d=Math.hypot(dx,dy);if(d>R){dx*=R/d;dy*=R/d}
    knob.style.transform=`translate(${dx}px,${dy}px)`;const m=Math.min(d,R)/R;TOUCH.x=m<.15?0:dx/R;TOUCH.z=m<.15?0:dy/R}
  zone.addEventListener('pointerdown',e=>{e.preventDefault();jid=e.pointerId;zone.setPointerCapture(jid);cx=e.clientX;cy=e.clientY;
    base.style.left=(cx-65)+'px';base.style.top=(cy-65)+'px';jm(e)});
  zone.addEventListener('pointermove',e=>{if(e.pointerId==jid)jm(e)});
  const end=e=>{if(e.pointerId!=jid)return;jid=null;TOUCH.x=TOUCH.z=0;knob.style.transform='';base.style.left=base.style.top=''};
  zone.addEventListener('pointerup',end);zone.addEventListener('pointercancel',end);
  [['bAtk','a'],['bRoll','r'],['bUse','u'],['bJump','j']].forEach(([id,k])=>{const b=$(id);
    b.addEventListener('pointerdown',e=>{e.preventDefault();TOUCH[k]=true;b.classList.add('on')});
    const up=()=>{TOUCH[k]=false;b.classList.remove('on')};['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,up))});
  addEventListener('keydown',()=>{document.body.classList.remove('touch');TOUCH.x=TOUCH.z=0});
  addEventListener('gamepadconnected',()=>document.body.classList.remove('touch'));
})();

// ---- Input (keyboard, standard gamepad / Xbox pad, WebXR controllers)
const keys={},prev={};
addEventListener('keydown',e=>{keys[e.code]=1;if(e.code=='Space')e.preventDefault()});addEventListener('keyup',e=>keys[e.code]=0);
const edge=(k,v)=>{const r=v&&!prev[k];prev[k]=v;return r};
function readInput(){
  let x=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0),z=(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0);
  let a=!!(keys.Space||keys.KeyJ),r=!!(keys.ShiftLeft||keys.KeyK),u=!!(keys.KeyE||keys.Enter),jv=!!keys.KeyL;
  const dz=v=>Math.abs(v)>.2?v:0;
  for(const g of (navigator.getGamepads?navigator.getGamepads():[])){if(!g)continue;const b=g.buttons.map(q=>q.pressed);
    x+=dz(g.axes[0]||0)+(b[15]?1:0)-(b[14]?1:0);z+=dz(g.axes[1]||0)+(b[13]?1:0)-(b[12]?1:0);
    a=a||b[0]||b[7]||b[5];r=r||b[1]||b[6]||b[4];u=u||b[2];jv=jv||b[3]}
  const s=renderer.xr.getSession();
  if(s)for(const src of s.inputSources){const g=src.gamepad;if(!g)continue;const b=g.buttons.map(q=>q.pressed);
    x+=dz(g.axes[2]||0);z+=dz(g.axes[3]||0);a=a||b[0];r=r||b[1];u=u||b[4]||b[5];jv=jv||b[3]}
  x+=TOUCH.x;z+=TOUCH.z;a=a||TOUCH.a;r=r||TOUCH.r;u=u||TOUCH.u;jv=jv||TOUCH.j;const m=Math.hypot(x,z);if(m>1){x/=m;z/=m}
  return{x,z,a,r:edge('r',r),u:edge('u',u),j:edge('j',jv)}}

// ---- HUD: DOM panels on desktop, two canvas boards in VR (stats/messages + quest board)
function mkPanel(w,h,px,py,pz,ry){const cv=document.createElement('canvas');cv.width=w;cv.height=h;const t=new THREE.CanvasTexture(cv);
  const m=new THREE.Mesh(new THREE.PlaneGeometry(w/512,h/512),new THREE.MeshBasicMaterial({map:t,transparent:true}));
  m.position.set(px,py,pz);m.rotation.y=ry;m.visible=false;scene.add(m);return{c:cv.getContext('2d'),t,m,w,h}}
const pnl=mkPanel(512,256,0,1.3,-1.9,0),qpn=mkPanel(512,384,-1.7,1.2,-1.2,.9);
function paint(p,txt){const c=p.c;c.clearRect(0,0,p.w,p.h);c.fillStyle='rgba(0,0,0,.65)';c.fillRect(0,0,p.w,p.h);c.fillStyle='#fff';c.font='20px sans-serif';let y=28;
  for(const l of txt.split('\n')){let ln='';for(const w of l.split(' ')){if(c.measureText(ln+w).width>p.w-32){c.fillText(ln,16,y);y+=25;ln=''}ln+=w+' '}c.fillText(ln,16,y);y+=25}p.t.needsUpdate=true}
const DIRS=['N','NE','E','SE','S','SW','W','NW'];
function hintFor(q){if((q.map||'overworld')!=MAP.name)return` (${CONFIG.maps[q.map].title})`;let tg=null;
  if(q.type=='reach')tg={x:q.at.x+.5,z:q.at.y+.5};
  else if(q.type=='collect'){const it=items.find(i=>i.id==q.item&&!i.got&&i.beacon);if(it)tg={x:it.x,z:it.z}}
  if(!tg)return'';const dx=tg.x-P.x,dz=tg.z-P.z;return` -> ${DIRS[(Math.round(Math.atan2(dx,-dz)/(Math.PI/4))+8)%8]} ${Math.round(Math.hypot(dx,dz))} tiles`}
const statStr=()=>{let t=`❤ ${S.hp}/${S.maxhp}   Lv ${S.lvl}   XP ${S.xp}/${S.lvl*20}   🪙 ${S.gold}
📍 ${MAP.title}`;
  for(const e of enemies)if(e.d.boss&&e.hp>0&&e.m.visible){const n=Math.max(0,Math.round(e.hp/e.d.hp*12));t+=`
${e.d.label||e.type}  ${'█'.repeat(n)+'░'.repeat(12-n)}`}return t};
function questStr(){let t='';for(const q of CONFIG.quests){const st=S.q[q.id];if(!st||st.state=='done')continue;
  const o=st.state=='ready'?`return to ${npcName(q.giver)}`:q.type=='kill'?`defeat ${q.target} ${st.prog}/${q.count}`:q.type=='collect'?`find ${q.item} ${st.prog}/${q.count}`:q.type=='visit'?`meet ${st.prog}/${q.targets.length} characters`:q.type=='talk'?`talk to ${npcName(q.target)}`:`go to ${q.where||'the marked area'}`;
  t+=(t?'\n':'')+`${'★'.repeat(q.diff||1)} ${q.title}: ${o}${st.state=='ready'?'':hintFor(q)}`}
  return t?'QUEST BOARD\n'+t:''}
let lastTxt='';
function refresh(){if(!MAP)return;const a=statStr(),b=questStr(),t=a+'|'+b+'|'+S.msg;if(t==lastTxt)return;lastTxt=t;
  $('hud').textContent=a;$('quests').textContent=b;
  const m=$('msg');m.textContent=S.msg;m.style.display=S.msg?'block':'none';
  paint(pnl,a+(S.msg?'\n\n'+S.msg:''));paint(qpn,b||'QUEST BOARD\nNo active quests.\nTalk to villagers marked with !')}
setInterval(refresh,150);

const aimed=c=>{rm.identity().extractRotation(c.matrixWorld);ray.ray.origin.setFromMatrixPosition(c.matrixWorld);ray.ray.direction.set(0,0,-1).applyMatrix4(rm);return ray.intersectObject(exitBtn).length>0};
[0,1].forEach(i=>{const c=renderer.xr.getController(i);

// ---- Music: procedural WebAudio. Adventurous theme normally, suspenseful theme while enemies chase or hit you.
const music=(()=>{let ac,adv,sus,master,on=true,started=false,combat=false,ta=0,ts=0,sa=0,ss=0;
  const hz=m=>440*Math.pow(2,(m-69)/12);
  function tone(bus,f,t,d,type,g){const o=ac.createOscillator(),v=ac.createGain();o.type=type;o.frequency.value=f;
    v.gain.setValueAtTime(0,t);v.gain.linearRampToValueAtTime(g,t+.01);v.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(v);v.connect(bus);o.start(t);o.stop(t+d+.05)}
  function thump(bus,t,g){const o=ac.createOscillator(),v=ac.createGain();o.frequency.setValueAtTime(110,t);o.frequency.exponentialRampToValueAtTime(40,t+.15);
    v.gain.setValueAtTime(g,t);v.gain.exponentialRampToValueAtTime(.0001,t+.22);o.connect(v);v.connect(bus);o.start(t);o.stop(t+.25)}
  const ROOT=[48,53,55,45],SCALE=[72,74,76,77,79,81,83,84],MEL=[0,2,4,2,5,4,2,1,0,2,4,5,7,5,4,2];
  function advStep(t){const s=sa++,bar=Math.floor(s/8)%4,b=s%8;
    if(b%2==0)tone(adv,hz(ROOT[bar]+(b==4?7:0)),t,.3,'triangle',.5);
    tone(adv,hz(SCALE[MEL[s%16]]),t,b%2?.12:.2,'square',.07);
    if(b==2||b==6)tone(adv,hz(ROOT[bar]+16),t,.1,'triangle',.12)}
  const STING=[76,77,70,75,82];
  function susStep(t){const s=ss++;
    if(s%8==0||s%8==2)thump(sus,t,.9);
    tone(sus,hz(s%2?33:34),t,.3,'sawtooth',.12);
    if(s%6==3)tone(sus,hz(STING[(s*7)%5]),t,1.1,'sine',.1);
    if(s%4==1)tone(sus,hz(57+(s%3)),t,.12,'square',.04)}
  function tick(){const now=ac.currentTime;
    while(ta<now+.3){if(ta<now)ta=now;advStep(ta);ta+=.2}
    while(ts<now+.3){if(ts<now)ts=now;susStep(ts);ts+=.3}}
  return{start(){if(started){if(ac.state=='suspended')ac.resume();return}started=true;
      ac=new(window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=on?.3:0;master.connect(ac.destination);
      adv=ac.createGain();sus=ac.createGain();sus.gain.value=0;adv.connect(master);sus.connect(master);ta=ts=ac.currentTime+.1;setInterval(tick,90)},
    set(c){if(!started||c==combat)return;combat=c;adv.gain.setTargetAtTime(c?0:1,ac.currentTime,.4);sus.gain.setTargetAtTime(c?1:0,ac.currentTime,.3)},
    toggle(){on=!on;if(master)master.gain.setTargetAtTime(on?.3:0,ac.currentTime,.1);return on}}})();
['pointerdown','keydown'].forEach(e=>addEventListener(e,()=>music.start()));
$('mute').onclick=()=>{music.start();$('mute').textContent=music.toggle()?'🔊':'🔇'};

// ---- Parts + title screen. Part 2 shuffles its quest order every run.
const ALLQ=CONFIG.quests.slice();let paused=true,PARTN=0;
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function showTitle(){paused=true;$('title').style.display='flex'}
function startPart(n){PARTN=n;PART=CONFIG.parts[n];
  for(const k in CONFIG.maps)delete CONFIG.maps[k]._x;
  CONFIG.quests=ALLQ.filter(q=>(q.part||1)==n);if(PART.shuffle)shuffle(CONFIG.quests);
  Object.assign(S,{hp:PART.hp,maxhp:PART.hp,xp:0,lvl:1,gold:0,q:{},got:{},msg:'',msgT:0,talk:false,alert:0,flip:false});
  world.remove(P.m);P.m=makeModel(PART.player);P.m.rotation.order='YXZ';P.m.add(rip);
  Object.assign(P,{h:0,vy:0,air:false,dj:false,fl:0,roll:0,atk:0,inv:0,kx:0,kz:0});

Object.keys(CONFIG.parts).forEach(k=>{const p=CONFIG.parts[k],b=document.createElement('button');b.innerHTML=`<b>${p.title}</b><br><span>${p.blurb}</span>`;b.onclick=()=>startPart(+k);$('tbtns').appendChild(b)});

// ---- Main loop
const camTarget=new THREE.Vector3();let last=0;
function update(dt,t){
  const I=readInput(),cfg=CONFIG.player;
  P.atk-=dt;P.inv-=dt;P.rcd-=dt;S.alert=Math.max(0,(S.alert||0)-dt);music.set(S.alert>0);if(S.msgT>0&&(S.msgT-=dt)<=0){S.msg='';S.talk=false}
  if(P.kx||P.kz){move(P,P.kx*dt,P.kz*dt);P.kx*=Math.pow(.001,dt);P.kz*=Math.pow(.001,dt);if(Math.abs(P.kx)+Math.abs(P.kz)<.1)P.kx=P.kz=0}
  const mv=Math.hypot(I.x,I.z)>.05,sw=!!tileAt(Math.floor(P.x),Math.floor(P.z)).water,spd=sw?cfg.speed*.65:cfg.speed;
  if(I.r&&P.roll<=0&&P.rcd<=0&&!sw){if(mv)P.ang=Math.atan2(I.x,I.z);P.roll=.25;P.rcd=.6}
  if(P.roll>0){P.roll-=dt;move(P,Math.sin(P.ang)*cfg.rollSpeed*dt,Math.cos(P.ang)*cfg.rollSpeed*dt)}
  else if(mv){P.ang=Math.atan2(I.x,I.z);move(P,I.x*spd*dt,I.z*spd*dt)}
  if(PART.jump){   // Part 2: jump (and a flip once unlocked). Jumping dodges attacks and crosses pits.
    if(I.j){if(!P.air){P.vy=7.5;P.air=true;P.dj=false}else if(S.flip&&!P.dj){P.vy=7;P.dj=true;P.fl=1}}
    if(P.air){P.vy-=16*dt;P.h+=P.vy*dt;if(P.h<=0){P.h=0;P.vy=0;P.air=false;if(tileAt(Math.floor(P.x),Math.floor(P.z)).gap){hurt(1,0,0);P.x=P.sx;P.z=P.sz;say('You fell! Try again.',3)}}}
    else if(!tileAt(Math.floor(P.x),Math.floor(P.z)).gap){P.sx=P.x;P.sz=P.z}
    P.fl=Math.max(0,P.fl-dt*1.7)}
  if(I.a)attack();
  if(P.atk<.15)slash.visible=false;
  slash.position.set(P.x+Math.sin(P.ang),.5,P.z+Math.cos(P.ang));
